# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Diego's Digital Garden
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: garden.diego.codes
  ignorePatterns:
    - private
    - templates
    - .obsidian
    - .trash
    - Assets
    # TaskNotes rewrites this folder constantly (a note can vanish mid-parse,
    # which is a fatal ENOENT for the build) and none of it is published anyway.
    - Personal/Tasks
    - Personal/Tasks/**
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: JetBrains Mono
      body: Nunito
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#ffffff"
        lightgray: "#e0e0e0"
        gray: "#8c8c8c"
        darkgray: "#383838"
        dark: "#2b2b2b"
        secondary: "#008080"
        tertiary: "#006666"
        highlight: rgba(0, 128, 128, 0.1)
        textHighlight: "#fff23688"
      darkMode:
        light: "#303446"
        lightgray: "#41455a"
        gray: "#848ba7"
        darkgray: "#c6d0f5"
        dark: "#ebebec"
        secondary: "#5ab8b8"
        tertiary: "#7dcfcf"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#b3aa0288"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
      disableBrokenWikilinks: true
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: false
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: true
    options:
      body: Nunito
      header: JetBrains Mono
      title: JetBrains Mono
      code: JetBrains Mono
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/alias-redirects
    enabled: false
  - source: github:diego-vicente/content-index # fork: adds normalized `type` to contentIndex.json (for graph node coloring)
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: false
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:diego-vicente/folder-page # fork: skip folder listing when the folder has an index.base
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: false
    layout:
      position: left
      priority: 50
  - source: github:diego-vicente/graph # fork: colors nodes by note `type` via --lt-<type> CSS palette
    enabled: true
    options:
      # Remove tag nodes from both graphs; color nodes by type (custom.scss --lt-* + arbor-graph-data.ts).
      localGraph:
        showTags: false
      globalGraph:
        showTags: false
    layout:
      position: right
      priority: 10
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: right
      priority: 1
      group: toolbar
      groupOptions:
        grow: true
  - source: github:diego-vicente/backlinks # fork: groups backlinks by note type, collapsed by default
    enabled: true
    layout:
      position: right
      priority: 50
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: false # date moved into the per-type Properties block (arbor-properties.ts); reading time off
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: beforeBody
      priority: 1
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: right
      priority: 2
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: right
      priority: 3
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/footer
    # Replaced by ArborFooter, rendered directly in the page frames
    # (quartz/components/ArborFooter.tsx). Disabled so it doesn't double-render.
    enabled: false
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:diego-vicente/bases-page
    enabled: true
    options:
      excludePathPrefixes:
        - CARTO
        - Personal
        - Assets/Exported slides
        - Assets/Templates
        - Assets/Slides themes
    order: 50
  - source: github:diego-vicente/arbor-taxonomy
    enabled: true
    options: {}
    order: 80
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true # Arbor renders its own per-type Properties block (arbor-properties.ts); keep this plugin only as the frontmatter parser
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
    layout:
      position: body
      priority: 100
      display: all
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 5
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content:
      template: garden
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases:
      template: garden
